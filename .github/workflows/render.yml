name: Render Video

on:
  workflow_dispatch:
    inputs:
      theme:
        description: "Theme to render"
        type: choice
        default: podcast
        options:
          - podcast
          - infographic
          - both
      quality:
        description: "preview = small and fast, full = final quality"
        type: choice
        default: preview
        options:
          - preview
          - full
      audio_volume:
        description: "Audio volume (1.0 = unchanged)"
        type: string
        default: "1.0"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji fonts-noto-extra
          fc-cache -f

      - name: Download SolaimanLipi (only if not already in the repo)
        run: |
          mkdir -p assets/fonts
          get() {
            f="assets/fonts/$1"; url="$2"
            if [ -s "$f" ]; then echo "$1 already in repo - skipped"; return; fi
            if curl -fsSL --retry 3 --max-time 60 -o "$f" "$url" && [ -s "$f" ]; then
              echo "downloaded $1"
            else
              rm -f "$f"
              echo "::warning::Could not download $1. Upload the TTF manually to assets/fonts/ (Bengali will fall back to Noto Serif/Sans Bengali until then)."
            fi
          }
          get SolaimanLipi-Regular.ttf https://fonts.maateen.me/solaiman-lipi/solaimanlipi-normal-v1.0.ttf
          get SolaimanLipi-Bold.ttf https://fonts.maateen.me/solaiman-lipi/solaimanlipi-bold-v1.0.ttf

      - name: Install Node packages
        run: npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Render podcast (16:9)
        if: ${{ inputs.theme == 'podcast' || inputs.theme == 'both' }}
        env:
          THEME: podcast
          WIDTH: ${{ inputs.quality == 'full' && '1920' || '960' }}
          FPS: ${{ inputs.quality == 'full' && '30' || '15' }}
          AUDIO_VOLUME: ${{ inputs.audio_volume }}
        run: node render.js

      - name: Render infographic (9:16)
        if: ${{ inputs.theme == 'infographic' || inputs.theme == 'both' }}
        env:
          THEME: infographic
          WIDTH: ${{ inputs.quality == 'full' && '1080' || '540' }}
          FPS: ${{ inputs.quality == 'full' && '30' || '15' }}
          AUDIO_VOLUME: ${{ inputs.audio_volume }}
        run: node render.js

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/*.mp4
          retention-days: 14
